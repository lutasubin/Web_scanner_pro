name: web_scanner_pro
description: Android utilities for linked WhatsApp Web sessions and local media.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  get_it: ^9.2.0
  firebase_core: ^4.6.0
  firebase_remote_config: ^6.2.0
  google_mobile_ads: ^9.2.0
  share_plus: ^13.3.1
  flutter_native_splash: ^2.4.7
  firebase_analytics: ^12.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
 

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo_app/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo_app/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#22C763"
  adaptive_icon_foreground: "assets/logo_app/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo_app/logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/logo_app/logo.png"
    icon_background_color: "#22C763"
  android: true
  ios: false
  web: false



